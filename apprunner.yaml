version: 1.0
runtime: dotnet8
build:
  commands:
    pre-build:
      - cd ForumApi
    build:
      - dotnet publish -c Release -o out
run:
  runtime-version: 8.0
  command: cd ForumApi/out && dotnet ForumApi.dll
  network:
    port: 8080
    env: ASPNETCORE_URLS
  env:
    - name: ASPNETCORE_URLS
      value: "http://+:8080"